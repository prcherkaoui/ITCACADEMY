name: Deploy ITCACADEMY to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble static site for www.itcacademy.online
        run: |
          mkdir -p _site
          for f in index.html inscription.html style.css script.js i18n-darija.js inscriptions-ui.js logo.jpg logo-full.jpg poster.jpg video.mp4 CNAME .nojekyll robots.txt sitemap.xml; do
            if [ -f "$f" ]; then
              cp "$f" _site/
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
